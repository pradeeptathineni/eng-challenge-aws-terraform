version: 2.1

jobs:
  terraform-static:
    docker:
      # Pin CI to the same stable Terraform version used for local dev
      - image: hashicorp/terraform:1.15.8
        # HashiCorp's image normally launches Terraform directly
        # Override the entrypoint so CircleCI can execute normal shell-based build steps
        entrypoint: /bin/sh
    working_directory: ~/project

    steps:
      - checkout
      - run:
          name: Install Make
          command: apk add --no-cache make
      - run:
          name: Terraform Version
          command: make version
      - run:
          name: Terraform Format Check
          command: make fmt-check
      - run:
          name: Terraform Validate
          # Uses backend-disabled initialization for static CI validation
          # Does not need access to deployed infrastructure state
          command: make validate-ci

workflows:
  terraform-ci:
    jobs:
      - terraform-static