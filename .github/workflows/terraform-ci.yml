# References
# HashiCorp setup-terraform action

name: Engineering Challenge AWS Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Will need OIDC permissions later
permissions:
  contents: read
  # id-token: write

jobs:
  terraform-static:
    name: Terraform Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          # Keep CI aligned with the Terraform version used locally
          terraform_version: 1.16.0

      - name: Project Checks
        # Use the same static validation workflow used locally
        # No AWS credentials or Terraform backend access required
        run: make check
